# Smithery configuration for Kommo
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_kommo

name: kommo-mcp
displayName: "Kommo"
description: >
  Kommo CRM (ex-amoCRM), o CRM de vendas por conversa (WhatsApp, Instagram, Telegram) usado por PMEs e agências. Leia e escreva leads, contatos, empresas, tarefas, notas, funis, tags, campos personalizados, usuários, eventos, conversas e catálogos pela API v4 oficial. Você informa o subdomínio da sua conta e um Token de Longa Duração e a plataforma opera na sua conta. Inclui uma ferramenta de chamada crua para qualquer endpoint da API.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/kommo-mcp
repository: https://github.com/mcp-dir/kommo-mcp

tags:
  - kommo
  - brazil
  - crm
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_kommo

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_kommo/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
